services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8000
  web:
    build:
      context: ..
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PALM_DOMAIN: ${PALM_DOMAIN:?Set PALM_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
volumes:
  caddy_data:
  caddy_config:
